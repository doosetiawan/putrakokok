<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mode Karyawan - Toko Putra Kokok</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        
        /* Custom Scrollbar Minimalis */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Animasi Transisi Halus */
        .cart-item-enter { animation: fadeIn 0.25s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(10px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">

    <!-- Header / Navbar Biru -->
    <header class="bg-blue-800 text-white shadow-md sticky top-0 z-40 border-b border-blue-900">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-white/20 p-2 rounded-xl backdrop-blur-sm">
                    <i class="fas fa-store text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-sm sm:text-base leading-tight tracking-wide">Toko Putra Kokok</h1>
                    <p class="text-blue-200 text-[10px] font-semibold uppercase tracking-wider mt-0.5">Mode Pramuniaga</p>
                </div>
            </div>
            
            <div class="flex items-center gap-4">
                <!-- Search Bar (Desktop only, hidden on small mobile) -->
                <div class="hidden sm:block relative">
                    <input type="text" id="desktop-search" placeholder="Cari barang..." class="py-2 pl-10 pr-4 rounded-xl bg-blue-900/50 text-white placeholder-blue-300 border border-blue-700/50 focus:outline-none focus:bg-white focus:text-slate-800 focus:placeholder-slate-400 transition-colors w-64 text-sm shadow-inner">
                    <i class="fas fa-search absolute left-3.5 top-2.5 text-blue-300" id="desktop-search-icon"></i>
                </div>
                <!-- User Profile -->
                <div class="flex items-center gap-2 border-l border-blue-700 pl-4">
                    <span class="text-xs font-semibold hidden sm:block">Andi Pramuniaga</span>
                    <div class="w-8 h-8 rounded-full bg-blue-600 border border-blue-400 flex items-center justify-center text-xs shadow-inner">
                        <i class="fas fa-user"></i>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Layout -->
    <!-- Tambahan pb-24 pada mobile agar grid produk tidak tertutup tombol melayang -->
    <main class="flex-1 max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-5 sm:py-6 flex flex-col lg:flex-row gap-6 pb-24 lg:pb-6 relative">
        
        <!-- ==================================
             KOLOM KIRI: PRODUCT LIST (Tanpa Gambar)
        =================================== -->
        <div class="w-full lg:w-2/3 xl:w-3/4 flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-base sm:text-lg font-bold text-slate-800 flex items-center gap-2">
                    <i class="fas fa-box-open text-blue-600"></i> Katalog Produk
                </h2>
                <!-- Mobile search (visible only on mobile) -->
                <div class="sm:hidden relative w-1/2">
                    <input type="text" id="mobile-search" placeholder="Cari..." class="w-full py-2 pl-9 pr-3 rounded-xl border border-slate-200 bg-white text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 shadow-sm">
                    <i class="fas fa-search absolute left-3 top-2.5 text-slate-400 text-xs"></i>
                </div>
            </div>
            
            <!-- Product Grid Modern -->
            <div class="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-4 gap-3 sm:gap-4" id="product-list">
                <!-- Products dynamically injected via JS -->
            </div>
        </div>

        <!-- ==================================
             KOLOM KANAN: KERANJANG (Drawer di HP, Sidebar di Desktop)
        =================================== -->
        
        <!-- Overlay Gelap (Hanya Muncul di HP saat Keranjang Dibuka) -->
        <div id="cart-overlay" onclick="toggleMobileCart()" class="lg:hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-40 hidden opacity-0 transition-opacity duration-300"></div>
        
        <!-- Container Keranjang (Bottom Sheet di HP, Kolom Kanan di Desktop) -->
        <div id="cart-sidebar" class="fixed inset-x-0 bottom-0 z-50 w-full h-[85vh] transform translate-y-full transition-transform duration-300 ease-in-out lg:relative lg:translate-y-0 lg:h-auto lg:w-1/3 xl:w-1/4 lg:z-auto">
            
            <!-- Isi Kartu Keranjang -->
            <div class="bg-white rounded-t-3xl lg:rounded-2xl shadow-[0_-10px_40px_rgba(0,0,0,0.1)] lg:shadow-xl lg:border border-slate-200 flex flex-col h-full lg:sticky lg:top-24 lg:max-h-[calc(100vh-7rem)] overflow-hidden">
                
                <!-- Cart Header -->
                <div class="p-4 sm:p-5 border-b border-slate-100 bg-slate-50 flex justify-between items-center shrink-0">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-lg bg-orange-100 text-orange-600 flex items-center justify-center">
                            <i class="fas fa-shopping-cart text-sm"></i>
                        </div>
                        <div>
                            <h2 class="font-bold text-slate-800 text-sm sm:text-base leading-tight">Rincian Pesanan</h2>
                            <p id="cart-badge" class="text-[10px] sm:text-xs font-semibold text-orange-600">0 Item terpilih</p>
                        </div>
                    </div>
                    <!-- Tombol Tutup (Hanya di HP) -->
                    <button onclick="toggleMobileCart()" class="lg:hidden w-8 h-8 rounded-full bg-slate-200 hover:bg-slate-300 text-slate-600 flex items-center justify-center transition-colors">
                        <i class="fas fa-chevron-down text-sm"></i>
                    </button>
                </div>

                <!-- Cart Items (Scrollable) -->
                <div class="flex-1 overflow-y-auto p-4 bg-white min-h-[200px]" id="cart-items">
                    <!-- Empty State -->
                    <div id="empty-cart-msg" class="h-full flex flex-col items-center justify-center text-slate-400 py-10">
                        <div class="w-16 h-16 bg-slate-50 rounded-full flex items-center justify-center mb-3">
                            <i class="fas fa-receipt text-2xl text-slate-300"></i>
                        </div>
                        <p class="text-sm font-semibold text-slate-500">Belum ada pesanan</p>
                        <p class="text-xs text-slate-400 text-center mt-1">Ketuk barang untuk menambahkan.</p>
                    </div>
                    <!-- Cart items injected via JS -->
                </div>

                <!-- Cart Footer -->
                <div class="p-5 border-t border-slate-100 bg-white shrink-0 shadow-[0_-5px_15px_-5px_rgba(0,0,0,0.05)]">
                    <div class="flex justify-between items-end mb-4">
                        <span class="text-slate-500 font-bold text-xs uppercase tracking-wider">Total Estimasi</span>
                        <span id="grand-total" class="text-2xl font-black text-blue-700 tracking-tight">Rp 0</span>
                    </div>
                    <button onclick="sendOrder()" id="btn-kirim" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white font-bold py-3.5 rounded-xl shadow-lg shadow-blue-600/20 transition-all flex items-center justify-center gap-2 disabled:opacity-50 disabled:active:scale-100 disabled:cursor-not-allowed group">
                        <span>Kirim ke Kasir Utama</span>
                        <i class="fas fa-paper-plane group-hover:translate-x-1 transition-transform text-sm"></i>
                    </button>
                </div>
                
            </div>
        </div>
        
    </main>

    <!-- ==================================
         FLOATING BOTTOM BAR (HANYA DI HP)
    =================================== -->
    <div id="floating-cart-btn" class="lg:hidden fixed bottom-0 left-0 right-0 p-4 z-30 bg-white border-t border-slate-100 shadow-[0_-10px_20px_-5px_rgba(0,0,0,0.1)] rounded-t-2xl transition-transform transform translate-y-full">
        <button onclick="toggleMobileCart()" class="w-full bg-blue-600 text-white rounded-xl py-3.5 px-5 font-bold flex justify-between items-center shadow-lg shadow-blue-600/30 active:scale-[0.98] transition-transform">
            <div class="flex items-center gap-3">
                <div class="bg-white/20 w-8 h-8 rounded-lg flex items-center justify-center text-sm">
                    <span id="floating-qty">0</span>
                </div>
                <span class="text-sm font-medium">Lihat Keranjang</span>
            </div>
            <span id="floating-total" class="text-lg tracking-wide">Rp 0</span>
        </button>
    </div>

    <!-- Global Toast Notification Container -->
    <div id="toast-container" class="fixed top-6 left-1/2 transform -translate-x-1/2 z-[60] flex flex-col gap-2 pointer-events-none w-max max-w-[90vw]">
        <!-- Toasts will appear here -->
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // --- DATA & STATE ---
        const products = [
            { id: 1, name: 'Ember Besar Plastik', price: 75000 },
            { id: 2, name: 'Sapu Lidi Taman', price: 14500 },
            { id: 3, name: 'Serok Sampah', price: 36000 },
            { id: 4, name: 'Wajan Anti Lengket 30cm', price: 165000 },
            { id: 5, name: 'Bak Mandi Bayi', price: 28000 },
            { id: 6, name: 'Rak Kecil 3 Susun', price: 130000 },
            { id: 7, name: 'Sandal Jepit Karet', price: 15000 },
            { id: 8, name: 'Keset Kain Perca', price: 25000 },
            { id: 9, name: 'Susu Kaleng Kental Manis', price: 12000 },
            { id: 10, name: 'Kopi Hitam Bubuk 200gr', price: 15000 }
        ];

        let cart = [];

        // --- UTILITIES ---
        const formatRupiah = (number) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number);

        const showToast = (message, type = 'success') => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const bgColor = type === 'success' ? 'bg-slate-900' : 'bg-red-600';
            const iconColor = type === 'success' ? 'text-blue-400' : 'text-white';
            const iconType = type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle';

            toast.className = `${bgColor} text-white px-5 py-3 rounded-full shadow-2xl flex items-center gap-3 transform transition-all duration-300 translate-y-[-20px] opacity-0`;
            toast.innerHTML = `
                <i class="fas ${iconType} ${iconColor} text-lg"></i>
                <span class="font-semibold text-sm">${message}</span>
            `;
            container.appendChild(toast);

            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-[-20px]', 'opacity-0');
                toast.classList.add('translate-y-0', 'opacity-100');
            });

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-[-20px]', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        };

        // --- MOBILE CART TOGGLE LOGIC ---
        const toggleMobileCart = () => {
            const sidebar = document.getElementById('cart-sidebar');
            const overlay = document.getElementById('cart-overlay');
            
            if (sidebar.classList.contains('translate-y-full')) {
                // Buka Bottom Sheet
                sidebar.classList.remove('translate-y-full');
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.remove('opacity-0'), 10);
            } else {
                // Tutup Bottom Sheet
                sidebar.classList.add('translate-y-full');
                overlay.classList.add('opacity-0');
                setTimeout(() => overlay.classList.add('hidden'), 300);
            }
        };

        // --- UI RENDERING ---
        const renderProducts = (filterText = '') => {
            const container = document.getElementById('product-list');
            container.innerHTML = '';
            
            const filtered = products.filter(p => p.name.toLowerCase().includes(filterText.toLowerCase()));
            
            if(filtered.length === 0) {
                container.innerHTML = `<div class="col-span-full py-10 text-center text-slate-400 text-sm font-medium">Barang tidak ditemukan</div>`;
                return;
            }

            filtered.forEach(product => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl p-4 shadow-sm border border-slate-200 hover:border-blue-500 hover:shadow-lg active:scale-95 cursor-pointer transition-all duration-300 flex flex-col justify-between relative overflow-hidden h-32 sm:h-36 group';
                card.onclick = () => addToCart(product.id);
                card.innerHTML = `
                    <div class="absolute top-0 left-0 w-full h-1 bg-blue-600 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                    <div>
                        <h3 class="font-bold text-slate-700 text-xs sm:text-sm leading-snug mb-1.5 group-hover:text-blue-700 transition-colors">${product.name}</h3>
                        <p class="text-blue-700 font-black text-base sm:text-lg tracking-tight">${formatRupiah(product.price)}</p>
                    </div>
                    <div class="mt-2 w-full py-1.5 bg-blue-50 group-hover:bg-blue-600 text-blue-700 group-hover:text-white rounded-xl text-xs font-bold text-center transition-all duration-300">
                        Tambah +
                    </div>
                `;
                container.appendChild(card);
            });
        };

        const renderCart = () => {
            const container = document.getElementById('cart-items');
            const emptyMsg = document.getElementById('empty-cart-msg');
            const totalEl = document.getElementById('grand-total');
            const badgeEl = document.getElementById('cart-badge');
            const btnKirim = document.getElementById('btn-kirim');
            const floatingBtn = document.getElementById('floating-cart-btn');

            let grandTotal = 0;
            let totalItems = 0;
            
            // Bersihkan isi cart kecuali pesan kosong
            Array.from(container.children).forEach(child => {
                if(child.id !== 'empty-cart-msg') child.remove();
            });

            if (cart.length === 0) {
                emptyMsg.style.display = 'flex';
                btnKirim.disabled = true;
                // Sembunyikan tombol melayang jika kosong
                floatingBtn.classList.add('translate-y-full');
            } else {
                emptyMsg.style.display = 'none';
                btnKirim.disabled = false;
                // Munculkan tombol melayang jika ada isi
                floatingBtn.classList.remove('translate-y-full');

                cart.forEach(item => {
                    const subtotal = item.price * item.qty;
                    grandTotal += subtotal;
                    totalItems += item.qty;

                    const cartRow = document.createElement('div');
                    cartRow.className = 'bg-white p-3 rounded-2xl border border-slate-100 shadow-sm mb-3 flex justify-between items-center cart-item-enter relative overflow-hidden group';
                    
                    cartRow.innerHTML = `
                        <div class="flex-1 min-w-0 pr-2">
                            <h4 class="text-xs sm:text-sm font-bold text-slate-800 leading-tight mb-1 truncate">${item.name}</h4>
                            <div class="flex items-center text-[11px] text-slate-400 font-semibold">
                                ${formatRupiah(item.price)}
                            </div>
                        </div>
                        <div class="flex flex-col items-end shrink-0 gap-1.5">
                            <span class="text-sm font-black text-slate-800">${formatRupiah(subtotal)}</span>
                            <div class="flex items-center bg-slate-50 border border-slate-200 rounded-lg overflow-hidden h-7">
                                <button onclick="updateQty(${item.id}, -1)" class="w-7 h-full hover:bg-slate-200 text-slate-600 flex items-center justify-center transition-colors">
                                    <i class="fas fa-minus text-[10px]"></i>
                                </button>
                                <span class="w-6 text-center text-xs font-bold text-slate-800">${item.qty}</span>
                                <button onclick="updateQty(${item.id}, 1)" class="w-7 h-full hover:bg-blue-100 text-blue-700 flex items-center justify-center transition-colors">
                                    <i class="fas fa-plus text-[10px]"></i>
                                </button>
                            </div>
                        </div>
                    `;
                    container.appendChild(cartRow);
                });
            }

            // Update Semua Teks Total
            const totalText = formatRupiah(grandTotal);
            totalEl.innerText = totalText;
            badgeEl.innerText = `${totalItems} Item terpilih`;
            
            // Update Teks Floating Button Mobile
            document.getElementById('floating-qty').innerText = totalItems;
            document.getElementById('floating-total').innerText = totalText;
        };

        // --- ACTIONS ---
        const addToCart = (productId) => {
            const product = products.find(p => p.id === productId);
            const existing = cart.find(item => item.id === productId);

            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ ...product, qty: 1 });
            }
            renderCart();
            showToast(`${product.name} ditambahkan`);
        };

        const updateQty = (productId, delta) => {
            const idx = cart.findIndex(item => item.id === productId);
            if (idx > -1) {
                cart[idx].qty += delta;
                if (cart[idx].qty <= 0) {
                    cart.splice(idx, 1);
                }
                renderCart();
            }
        };

        const sendOrder = () => {
            if (cart.length === 0) return;

            const btn = document.getElementById('btn-kirim');
            const originalContent = btn.innerHTML;
            
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Memproses...';
            btn.disabled = true;

            setTimeout(() => {
                showToast('Pesanan berhasil dikirim ke Kasir Utama!');
                cart = []; 
                renderCart();
                btn.innerHTML = originalContent; 
                
                // Tutup drawer di HP otomatis setelah kirim
                if(window.innerWidth < 1024) {
                    toggleMobileCart();
                }
            }, 1000);
        };

        // --- SEARCH HANDLERS ---
        document.getElementById('desktop-search').addEventListener('input', (e) => renderProducts(e.target.value));
        document.getElementById('mobile-search').addEventListener('input', (e) => renderProducts(e.target.value));

        // Styling effect on search focus
        const desktopSearch = document.getElementById('desktop-search');
        const desktopSearchIcon = document.getElementById('desktop-search-icon');
        desktopSearch.addEventListener('focus', () => desktopSearchIcon.classList.replace('text-blue-300', 'text-slate-400'));
        desktopSearch.addEventListener('blur', () => desktopSearchIcon.classList.replace('text-slate-400', 'text-blue-300'));

        // --- INITIALIZE ---
        window.onload = () => {
            renderProducts();
            renderCart();
        };
    </script>
</body>
</html>
