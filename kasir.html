<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir Utama - Toko Putra Kokok</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; overflow: hidden; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Animations */
        .fade-in { animation: fadeIn 0.2s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { 
            -webkit-appearance: none; margin: 0; 
        }
    </style>
</head>
<body class="flex flex-col h-screen text-slate-800">

    <!-- Header / Navbar -->
    <header class="bg-blue-800 text-white shadow-md z-50 shrink-0 relative">
        <div class="px-4 py-3 flex justify-between items-center h-14">
            <div class="flex items-center gap-3">
                <div class="bg-white/20 p-1.5 rounded-lg backdrop-blur-sm">
                    <i class="fas fa-desktop"></i>
                </div>
                <div>
                    <h1 class="font-bold text-sm sm:text-base leading-tight tracking-wide">Toko Putra Kokok</h1>
                    <p class="text-blue-200 text-[9px] sm:text-[10px] font-medium uppercase tracking-wider">Dashboard Kasir</p>
                </div>
            </div>
            
            <div class="flex items-center gap-4">
                <!-- Notification Bell untuk Order Karyawan -->
                <div class="relative">
                    <button onclick="toggleNotifications(event)" class="relative p-2 text-white hover:bg-blue-700 rounded-full transition">
                        <i class="fas fa-bell text-lg"></i>
                        <span id="nav-queue-count" class="absolute top-0 right-0 bg-red-500 text-white text-[9px] font-bold px-1.5 py-0.5 rounded-full border-2 border-blue-800">0</span>
                    </button>
                    
                    <!-- Dropdown Notifikasi -->
                    <div id="notification-dropdown" class="hidden absolute right-0 mt-3 w-72 sm:w-80 bg-white rounded-xl shadow-2xl border border-slate-200 z-50 overflow-hidden transform origin-top-right transition-all">
                        <div class="p-3 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                            <h3 class="font-bold text-slate-700 text-sm">Pesanan Pramuniaga</h3>
                            <button onclick="createNewOrder()" class="text-[10px] bg-blue-100 text-blue-700 px-2 py-1 rounded font-bold hover:bg-blue-200 shadow-sm border border-blue-200">+ Baru</button>
                        </div>
                        <div id="nav-queue-list" class="max-h-64 overflow-y-auto p-2 space-y-1 bg-white">
                            <!-- Items Injected by JS -->
                        </div>
                    </div>
                </div>

                <!-- User Profile -->
                <div class="flex items-center gap-3 border-l border-blue-700 pl-4">
                    <div class="text-right hidden sm:block">
                        <p class="text-sm font-bold">Budi Utama</p>
                        <p class="text-xs text-blue-300">Shift Pagi</p>
                    </div>
                    <div class="w-8 h-8 rounded-full bg-blue-600 border border-blue-400 flex items-center justify-center shadow-inner">
                        <i class="fas fa-user-tie text-xs"></i>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Layout -->
    <main class="flex-1 flex overflow-hidden relative">
        
        <!-- ==================================
             KOLOM UTAMA: PRODUCT GRID
        =================================== -->
        <!-- Tambahan pb-16 di mobile agar tidak tertutup tombol keranjang -->
        <section class="flex-1 flex flex-col bg-slate-100 relative z-0 pb-16 lg:pb-0">
            <!-- Search Bar -->
            <div class="p-3 bg-white border-b border-slate-200 shadow-sm shrink-0 flex items-center gap-2 z-10">
                <div class="relative flex-1">
                    <i class="fas fa-search absolute left-3 top-2.5 text-slate-400"></i>
                    <input type="text" id="product-search" placeholder="Cari nama produk..." class="w-full pl-10 pr-4 py-2 bg-slate-100 border-none rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none text-slate-700 font-medium">
                </div>
            </div>

            <!-- Product Grid -->
            <div class="flex-1 overflow-y-auto p-3 sm:p-4">
                <div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-3" id="product-grid">
                    <!-- Products injected by JS -->
                </div>
            </div>
        </section>

        <!-- ==================================
             KOLOM KANAN: ACTIVE CART (DRAWER DI HP)
        =================================== -->
        <!-- Overlay untuk HP -->
        <div id="cart-overlay" onclick="toggleMobileCart()" class="lg:hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-30 hidden opacity-0 transition-opacity"></div>
        
        <aside id="cart-sidebar" class="fixed inset-y-0 right-0 z-40 w-[85%] sm:w-96 bg-white border-l border-slate-200 flex flex-col shadow-2xl transform translate-x-full lg:translate-x-0 lg:relative transition-transform duration-300 ease-in-out">
            
            <!-- Cart Header -->
            <div class="p-4 border-b border-slate-200 bg-slate-50 flex justify-between items-center shrink-0">
                <div>
                    <h2 class="font-bold text-slate-800" id="cart-order-id">Pilih/Buat Pesanan</h2>
                    <p class="text-[11px] text-slate-500 font-medium mt-0.5" id="cart-order-staff">-</p>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="clearCart()" class="w-8 h-8 rounded-full text-slate-400 hover:text-red-500 hover:bg-red-50 flex items-center justify-center transition-colors" title="Kosongkan Keranjang">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                    <!-- Tombol tutup drawer (Hanya muncul di HP) -->
                    <button onclick="toggleMobileCart()" class="lg:hidden w-8 h-8 rounded-full bg-slate-200 text-slate-600 flex items-center justify-center">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>

            <!-- Cart Items (Scrollable) -->
            <div class="flex-1 overflow-y-auto p-3 bg-white" id="cart-items-container">
                <!-- Empty State -->
                <div id="cart-empty-state" class="h-full flex flex-col items-center justify-center text-slate-400">
                    <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mb-3">
                        <i class="fas fa-shopping-basket text-2xl opacity-50"></i>
                    </div>
                    <p class="text-sm font-medium">Keranjang kosong</p>
                </div>
                
                <!-- Items list -->
                <div id="cart-items-list" class="space-y-3 hidden">
                    <!-- Injected by JS -->
                </div>
            </div>

            <!-- Cart Footer -->
            <div class="bg-white border-t border-slate-200 p-4 shrink-0">
                <div class="flex justify-between items-center mb-4">
                    <span class="text-slate-500 text-sm font-semibold">Total Tagihan</span>
                    <span id="cart-grand-total" class="text-xl sm:text-2xl font-black text-blue-700">Rp 0</span>
                </div>
                
                <button id="btn-bayar" onclick="openPaymentModal()" disabled class="w-full bg-green-600 hover:bg-green-700 disabled:bg-slate-300 disabled:text-slate-500 text-white font-bold py-3.5 rounded-xl shadow-md transition-colors flex items-center justify-center gap-2 text-lg">
                    <i class="fas fa-wallet"></i> Bayar
                </button>
            </div>
        </aside>

        <!-- FLOATING BOTTOM BUTTON (HANYA DI HP) -->
        <div class="lg:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 p-3 z-20 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.05)]">
            <button onclick="toggleMobileCart()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl flex justify-between items-center px-5 shadow-lg active:scale-[0.98] transition-transform">
                <span class="flex items-center gap-3">
                    <i class="fas fa-shopping-cart"></i> 
                    <span id="mobile-cart-qty" class="text-sm">0 Item</span>
                </span>
                <span id="mobile-cart-total" class="text-lg">Rp 0</span>
            </button>
        </div>
    </main>

    <!-- ==================================
         PAYMENT MODAL (Sama seperti sebelumnya)
    =================================== -->
    <div id="payment-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[60] hidden items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-xl flex flex-col max-h-[90vh] fade-in overflow-hidden">
            <!-- Modal Header -->
            <div class="p-4 border-b border-slate-100 bg-slate-50 flex justify-between items-center shrink-0">
                <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <i class="fas fa-cash-register text-blue-600"></i> Pembayaran
                </h2>
                <button onclick="closePaymentModal()" class="w-8 h-8 rounded-full bg-slate-200 hover:bg-red-100 hover:text-red-600 flex items-center justify-center transition-colors">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <!-- Modal Body -->
            <div class="p-4 sm:p-5 flex-1 overflow-y-auto space-y-5">
                <div class="bg-blue-50 border border-blue-100 rounded-xl p-4 flex flex-col items-center justify-center">
                    <span class="text-blue-600 text-sm font-semibold mb-1">Total Tagihan</span>
                    <span id="modal-grand-total" class="text-2xl sm:text-3xl font-black text-blue-800">Rp 0</span>
                </div>

                <div>
                    <div class="flex justify-between items-end mb-3">
                        <label class="text-sm font-bold text-slate-700">Metode Bayar</label>
                        <button onclick="addPaymentRow()" class="text-[10px] sm:text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg font-bold transition-colors flex items-center gap-1">
                            <i class="fas fa-plus"></i> Split Payment
                        </button>
                    </div>
                    <div id="payment-rows" class="space-y-3"></div>
                </div>

                <hr class="border-slate-100">

                <div class="space-y-2">
                    <div class="flex justify-between text-slate-600 text-sm">
                        <span>Total Uang Diterima:</span>
                        <span id="modal-total-paid" class="font-bold text-slate-800">Rp 0</span>
                    </div>
                    <div id="modal-calculation-result" class="flex justify-between p-3 rounded-xl bg-slate-100 items-center">
                        <span class="font-semibold text-slate-700" id="modal-calc-label">Kurang/Kembali:</span>
                        <span class="text-lg sm:text-xl font-bold text-slate-800" id="modal-calc-value">Rp 0</span>
                    </div>
                </div>
            </div>

            <!-- Modal Footer -->
            <div class="p-4 border-t border-slate-100 bg-slate-50 flex justify-end gap-3 shrink-0">
                <button onclick="closePaymentModal()" class="px-4 py-2 rounded-xl border border-slate-300 text-slate-700 font-semibold hover:bg-slate-100">
                    Batal
                </button>
                <button id="btn-complete-payment" onclick="processPayment()" disabled class="px-5 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 disabled:bg-slate-400 text-white font-bold transition-colors flex items-center gap-2 shadow-md">
                    <i class="fas fa-print"></i> Cetak
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-5 left-1/2 transform -translate-x-1/2 z-[70] bg-slate-800 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 transition-all duration-300 opacity-0 translate-y-[-20px] pointer-events-none w-max max-w-[90vw]">
        <i class="fas fa-check-circle text-green-400 text-xl shrink-0"></i>
        <span id="toast-msg" class="font-medium text-sm truncate">Aksi berhasil!</span>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // --- MASTER DATA ---
        const masterProducts = [
             { id: 1, name: 'Ember Besar', price: 75000, icon: 'fa-bucket', color: 'text-blue-500', bg: 'bg-blue-100' },
            { id: 2, name: 'Sapu Lidi', price: 14500, icon: 'fa-broom', color: 'text-amber-800', bg: 'bg-amber-200' },
            { id: 3, name: 'Serok Sampah', price: 36000, icon: 'fa-trash', color: 'text-slate-600', bg: 'bg-slate-200' },
            { id: 4, name: 'Wajan Anti Lengket', price: 165000, icon: 'fa-fire-burner', color: 'text-orange-600', bg: 'bg-orange-100' },
            { id: 5, name: 'Bak Mandi Bayi', price: 28000, icon: 'fa-bath', color: 'text-teal-500', bg: 'bg-teal-100' },
            { id: 6, name: 'Rak Kecil 3 Susun', price: 130000, icon: 'fa-boxes-stacked', color: 'text-yellow-700', bg: 'bg-yellow-50' },
            { id: 7, name: 'Sandal Jepit', price: 15000, icon: 'fa-shoe-prints', color: 'text-red-600', bg: 'bg-red-100' },
            { id: 8, name: 'Keset Kain', price: 25000, icon: 'fa-rug', color: 'text-indigo-600', bg: 'bg-indigo-100' },
            { id: 9, name: 'Susu Kaleng', price: 12000, icon: 'fa-jar', color: 'text-blue-700', bg: 'bg-blue-200' },
            { id: 10, name: 'Kopi Hitam', price: 15000, icon: 'fa-mug-hot', color: 'text-slate-800', bg: 'bg-slate-300' }
        ];

        // Antrean dari Karyawan
        let queue = [
            {
                orderId: 'INV-' + Math.floor(Math.random() * 10000),
                staff: 'Andi Pramuniaga',
                time: '10:30',
                items: [
                    { ...masterProducts[0], qty: 2 },
                    { ...masterProducts[2], qty: 1 }
                ]
            },
            {
                orderId: 'INV-' + Math.floor(Math.random() * 10000),
                staff: 'Siti Karyawan',
                time: '10:35',
                items: [
                    { ...masterProducts[3], qty: 1 },
                    { ...masterProducts[6], qty: 2 }
                ]
            }
        ];

        // State Aplikasi
        let activeOrder = null;
        let paymentRows = [];
        let grandTotalActive = 0;
        let totalItemsActive = 0;

        // --- UTILITIES ---
        const formatRupiah = (number) => {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number);
        };

        const showToast = (msg) => {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('opacity-0', 'translate-y-[-20px]');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-[-20px]');
            }, 3000);
        };

        // UI Interactions
        const toggleNotifications = (e) => {
            if(e) e.stopPropagation();
            const dropdown = document.getElementById('notification-dropdown');
            dropdown.classList.toggle('hidden');
        };

        // Menutup notifikasi jika klik di luar
        document.addEventListener('click', (e) => {
            const dropdown = document.getElementById('notification-dropdown');
            if (!dropdown.classList.contains('hidden') && !e.target.closest('.relative')) {
                dropdown.classList.add('hidden');
            }
        });

        const toggleMobileCart = () => {
            const sidebar = document.getElementById('cart-sidebar');
            const overlay = document.getElementById('cart-overlay');
            
            if (sidebar.classList.contains('translate-x-full')) {
                // Buka Cart
                sidebar.classList.remove('translate-x-full');
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.remove('opacity-0'), 10);
            } else {
                // Tutup Cart
                sidebar.classList.add('translate-x-full');
                overlay.classList.add('opacity-0');
                setTimeout(() => overlay.classList.add('hidden'), 300);
            }
        };

        // --- RENDER FUNCTIONS ---

        // 1. Render Products
        const renderProducts = (filter = '') => {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            
            const filtered = masterProducts.filter(p => p.name.toLowerCase().includes(filter.toLowerCase()));
            
            if(filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-10 text-center text-slate-400">Barang tidak ditemukan</div>`;
                return;
            }

            filtered.forEach(product => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl p-3 shadow-sm border border-slate-200 hover:border-blue-400 active:scale-95 cursor-pointer transition-all flex flex-col justify-between group';
                card.onclick = () => addProductToCart(product);
                card.innerHTML = `
                    <div>
                        <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-lg ${product.bg} flex items-center justify-center mb-2">
                            <i class="fas ${product.icon} ${product.color} text-sm sm:text-lg"></i>
                        </div>
                        <h3 class="font-bold text-slate-800 text-[11px] sm:text-xs leading-tight mb-1">${product.name}</h3>
                        <p class="text-blue-600 font-bold text-xs mb-2">${formatRupiah(product.price)}</p>
                    </div>
                    <div class="w-full py-1.5 bg-slate-50 group-hover:bg-blue-600 text-slate-500 group-hover:text-white rounded border border-slate-200 text-[10px] font-bold text-center transition-colors">
                        <i class="fas fa-plus"></i> Tambah
                    </div>
                `;
                grid.appendChild(card);
            });
        };

        document.getElementById('product-search').addEventListener('input', (e) => {
            renderProducts(e.target.value);
        });

        // 2. Render Notifikasi Order di Navbar
        const renderQueue = () => {
            const list = document.getElementById('nav-queue-list');
            const count = document.getElementById('nav-queue-count');
            list.innerHTML = '';
            count.innerText = queue.length;
            
            if (queue.length === 0) {
                count.classList.add('hidden');
            } else {
                count.classList.remove('hidden');
            }

            if(queue.length === 0) {
                list.innerHTML = `<div class="text-center text-slate-400 py-4 text-xs font-medium">Tidak ada pesanan masuk</div>`;
                return;
            }

            queue.forEach(order => {
                const totalItems = order.items.reduce((sum, item) => sum + item.qty, 0);
                const isActive = activeOrder && activeOrder.orderId === order.orderId;
                
                const card = document.createElement('div');
                card.className = `p-2.5 rounded-lg border cursor-pointer transition-all ${isActive ? 'bg-blue-50 border-blue-300' : 'bg-white hover:bg-slate-50 border-slate-100'}`;
                card.onclick = () => {
                    loadOrderFromQueue(order.orderId);
                    document.getElementById('notification-dropdown').classList.add('hidden');
                };
                
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-1">
                        <span class="font-bold text-xs text-blue-700">#${order.orderId}</span>
                        <span class="text-[9px] text-slate-400">${order.time}</span>
                    </div>
                    <div class="flex justify-between items-center text-[10px] text-slate-600">
                        <span><i class="fas fa-user mr-1 text-slate-400"></i> ${order.staff}</span>
                        <span class="font-bold bg-slate-100 px-1.5 py-0.5 rounded">${totalItems} Pcs</span>
                    </div>
                `;
                list.appendChild(card);
            });
        };

        // 3. Render Cart
        const renderCart = () => {
            const container = document.getElementById('cart-items-list');
            const emptyState = document.getElementById('cart-empty-state');
            const btnBayar = document.getElementById('btn-bayar');
            
            container.innerHTML = '';
            grandTotalActive = 0;
            totalItemsActive = 0;

            if(!activeOrder || activeOrder.items.length === 0) {
                container.classList.add('hidden');
                emptyState.classList.remove('hidden');
                document.getElementById('cart-grand-total').innerText = 'Rp 0';
                btnBayar.disabled = true;
                
                document.getElementById('cart-order-id').innerText = activeOrder ? `#${activeOrder.orderId}` : 'Pilih/Buat Pesanan';
                document.getElementById('cart-order-staff').innerText = activeOrder ? `Kasir / Mandiri` : '-';
                updateMobileFloatingBtn();
                return;
            }

            container.classList.remove('hidden');
            emptyState.classList.add('hidden');
            btnBayar.disabled = false;

            document.getElementById('cart-order-id').innerText = `#${activeOrder.orderId}`;
            document.getElementById('cart-order-staff').innerText = activeOrder.staff !== 'Kasir' ? `Dari: ${activeOrder.staff}` : 'Kasir / Mandiri';

            activeOrder.items.forEach((item, index) => {
                const subtotal = item.price * item.qty;
                grandTotalActive += subtotal;
                totalItemsActive += item.qty;

                const row = document.createElement('div');
                row.className = 'bg-white border border-slate-100 p-2.5 rounded-xl shadow-sm flex justify-between items-center';
                row.innerHTML = `
                    <div class="flex-1 min-w-0 pr-2">
                        <h4 class="text-xs font-bold text-slate-800 truncate">${item.name}</h4>
                        <p class="text-[10px] text-slate-500">${formatRupiah(item.price)}</p>
                    </div>
                    <div class="flex flex-col items-end gap-1 shrink-0">
                        <span class="text-xs font-bold text-slate-800">${formatRupiah(subtotal)}</span>
                        <div class="flex items-center bg-slate-50 border border-slate-200 rounded-lg overflow-hidden">
                            <button onclick="updateCartQty(${index}, -1)" class="w-6 h-6 flex items-center justify-center hover:bg-slate-200 text-slate-600 transition-colors"><i class="fas fa-minus text-[9px]"></i></button>
                            <span class="w-6 text-center text-[10px] font-bold">${item.qty}</span>
                            <button onclick="updateCartQty(${index}, 1)" class="w-6 h-6 flex items-center justify-center hover:bg-blue-100 text-blue-600 transition-colors"><i class="fas fa-plus text-[9px]"></i></button>
                        </div>
                    </div>
                `;
                container.appendChild(row);
            });

            document.getElementById('cart-grand-total').innerText = formatRupiah(grandTotalActive);
            updateMobileFloatingBtn();
        };

        const updateMobileFloatingBtn = () => {
            document.getElementById('mobile-cart-qty').innerText = `${totalItemsActive} Item`;
            document.getElementById('mobile-cart-total').innerText = formatRupiah(grandTotalActive);
        };

        // --- CART ACTIONS ---
        const createNewOrder = () => {
            const timestamp = new Date().getTime().toString().slice(-4);
            activeOrder = {
                orderId: `KSR-${timestamp}`,
                staff: 'Kasir',
                items: []
            };
            document.getElementById('notification-dropdown').classList.add('hidden');
            renderQueue(); 
            renderCart();
            showToast('Sesi transaksi baru dimulai.');
        };

        const loadOrderFromQueue = (orderId) => {
            const orderToLoad = queue.find(q => q.orderId === orderId);
            activeOrder = JSON.parse(JSON.stringify(orderToLoad)); 
            renderQueue(); 
            renderCart();
            
            // Otomatis buka laci cart di HP jika order diload
            if(window.innerWidth < 1024) { // lg breakpoint
                const sidebar = document.getElementById('cart-sidebar');
                if (sidebar.classList.contains('translate-x-full')) {
                    toggleMobileCart();
                }
            }
        };

        const addProductToCart = (product) => {
            if(!activeOrder) createNewOrder();

            const existingIndex = activeOrder.items.findIndex(item => item.id === product.id);
            if(existingIndex > -1) {
                activeOrder.items[existingIndex].qty += 1;
            } else {
                activeOrder.items.push({ ...product, qty: 1 });
            }
            renderCart();
            
            // Animasi kecil saat tambah produk
            showToast(`${product.name} ditambahkan`);
        };

        const updateCartQty = (index, delta) => {
            if(!activeOrder) return;
            activeOrder.items[index].qty += delta;
            if(activeOrder.items[index].qty <= 0) {
                activeOrder.items.splice(index, 1);
            }
            renderCart();
        };

        const clearCart = () => {
            if(!activeOrder) return;
            activeOrder.items = [];
            renderCart();
        };

        // --- PAYMENT LOGIC --- (Sama seperti sebelumnya)
        const openPaymentModal = () => {
            if(!activeOrder || activeOrder.items.length === 0) return;
            document.getElementById('payment-modal').classList.remove('hidden');
            document.getElementById('payment-modal').classList.add('flex');
            document.getElementById('modal-grand-total').innerText = formatRupiah(grandTotalActive);
            
            paymentRows = [{ id: Date.now(), method: 'Tunai', amount: grandTotalActive }];
            renderPaymentRows();
        };

        const closePaymentModal = () => {
            document.getElementById('payment-modal').classList.add('hidden');
            document.getElementById('payment-modal').classList.remove('flex');
        };

        const addPaymentRow = () => {
            paymentRows.push({ id: Date.now(), method: 'QRIS', amount: 0 });
            renderPaymentRows();
        };

        const removePaymentRow = (id) => {
            if(paymentRows.length <= 1) return;
            paymentRows = paymentRows.filter(r => r.id !== id);
            renderPaymentRows();
        };

        const updatePaymentMethod = (id, value) => {
            const row = paymentRows.find(r => r.id === id);
            if(row) row.method = value;
        };

        const updatePaymentAmount = (id, value) => {
            const row = paymentRows.find(r => r.id === id);
            if(row) {
                row.amount = parseInt(value) || 0;
                calculatePaymentResult();
            }
        };

        const renderPaymentRows = () => {
            const container = document.getElementById('payment-rows');
            container.innerHTML = '';
            paymentRows.forEach((row) => {
                const div = document.createElement('div');
                div.className = 'flex gap-2 items-start';
                div.innerHTML = `
                    <div class="w-[40%]">
                        <select onchange="updatePaymentMethod(${row.id}, this.value)" class="w-full bg-white border border-slate-300 text-slate-700 text-xs sm:text-sm rounded-xl focus:ring-blue-500 p-2.5 outline-none font-semibold">
                            <option value="Tunai" ${row.method === 'Tunai' ? 'selected' : ''}>💵 Tunai</option>
                            <option value="QRIS" ${row.method === 'QRIS' ? 'selected' : ''}>📱 QRIS</option>
                            <option value="Debit" ${row.method === 'Debit' ? 'selected' : ''}>💳 Debit/Kredit</option>
                        </select>
                    </div>
                    <div class="flex-1 relative">
                        <span class="absolute left-2.5 top-2.5 font-bold text-slate-500 text-sm">Rp</span>
                        <input type="number" value="${row.amount}" oninput="updatePaymentAmount(${row.id}, this.value)" class="w-full bg-white border border-slate-300 text-slate-900 text-base sm:text-lg font-bold rounded-xl focus:ring-blue-500 p-2 pl-8 outline-none">
                    </div>
                    ${paymentRows.length > 1 ? `
                    <button onclick="removePaymentRow(${row.id})" class="mt-1 w-9 h-9 shrink-0 rounded-xl bg-red-50 text-red-500 hover:bg-red-100 flex items-center justify-center"><i class="fas fa-trash text-sm"></i></button>
                    ` : '<div class="w-9"></div>'}
                `;
                container.appendChild(div);
            });
            calculatePaymentResult();
        };

        const calculatePaymentResult = () => {
            const totalPaid = paymentRows.reduce((sum, row) => sum + row.amount, 0);
            document.getElementById('modal-total-paid').innerText = formatRupiah(totalPaid);

            const resultContainer = document.getElementById('modal-calculation-result');
            const labelEl = document.getElementById('modal-calc-label');
            const valueEl = document.getElementById('modal-calc-value');
            const btnComplete = document.getElementById('btn-complete-payment');
            const diff = totalPaid - grandTotalActive;

            if (diff < 0) {
                resultContainer.className = 'flex justify-between p-3 rounded-xl bg-red-50 border border-red-200 items-center';
                labelEl.innerText = 'Sisa (Kurang):';
                labelEl.className = 'font-semibold text-red-700 text-sm';
                valueEl.innerText = formatRupiah(Math.abs(diff));
                valueEl.className = 'text-base sm:text-lg font-bold text-red-700';
                btnComplete.disabled = true;
            } else {
                resultContainer.className = 'flex justify-between p-3 rounded-xl bg-green-50 border border-green-200 items-center';
                labelEl.innerText = diff === 0 ? 'Pas:' : 'Kembali:';
                labelEl.className = 'font-semibold text-green-700 text-sm';
                valueEl.innerText = formatRupiah(diff);
                valueEl.className = 'text-lg sm:text-xl font-black text-green-700';
                btnComplete.disabled = false;
            }
        };

        const processPayment = () => {
            queue = queue.filter(q => q.orderId !== activeOrder.orderId);
            activeOrder = null;
            closePaymentModal();
            
            if(window.innerWidth < 1024) toggleMobileCart(); // Tutup drawer cart di HP jika selesai bayar
            
            renderQueue();
            renderCart();
            showToast('Transaksi Berhasil! Mencetak struk...');
        };

        // --- INIT ---
        window.onload = () => {
            renderProducts();
            renderQueue();
            renderCart();
        };

    </script>
</body>
</html>
