<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir Modern - Toko Putra Kokok</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; overflow: hidden; }
        
        /* Custom Scrollbar Minimalis */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Hilangkan spinner pada input number */
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { 
            -webkit-appearance: none; margin: 0; 
        }

        /* Animasi Transisi Halus */
        .fade-in { animation: fadeIn 0.25s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="flex flex-col h-screen text-slate-800">

    <!-- Header / Navbar Modern (Sleek Dark Mode) -->
    <header class="bg-slate-900 text-white shadow-md z-50 shrink-0 relative border-b border-slate-800">
        <div class="px-5 py-3 flex justify-between items-center h-16">
            <div class="flex items-center gap-3">
                <div class="bg-white/10 p-2 rounded-xl backdrop-blur-md">
                    <i class="fas fa-layer-group text-blue-400"></i>
                </div>
                <div>
                    <h1 class="font-bold text-sm sm:text-base leading-tight tracking-wide text-slate-50">Toko Putra Kokok</h1>
                    <p class="text-slate-400 text-[10px] font-semibold uppercase tracking-widest mt-0.5">Sistem Kasir v2</p>
                </div>
            </div>
            
            <div class="flex items-center gap-5">
                <!-- Dropdown Notifikasi Order (Diubah jadi Keranjang) -->
                <div class="relative">
                    <button onclick="toggleNotifications(event)" class="relative p-2 text-slate-300 hover:text-white hover:bg-white/10 rounded-xl transition-all duration-300">
                        <i class="fas fa-shopping-cart text-lg"></i>
                        <span id="nav-queue-count" class="absolute -top-1 -right-1 bg-blue-500 text-white text-[9px] font-bold px-1.5 py-0.5 rounded-full shadow-sm">0</span>
                    </button>
                    
                    <!-- Dropdown Pesanan Pramuniaga -->
                    <div id="notification-dropdown" class="hidden absolute right-0 mt-4 w-72 sm:w-80 bg-white rounded-2xl shadow-[0_10px_40px_-10px_rgba(0,0,0,0.15)] border border-slate-100 z-50 overflow-hidden transform origin-top-right transition-all">
                        <div class="p-4 bg-slate-50/80 border-b border-slate-100 flex justify-between items-center backdrop-blur-sm">
                            <h3 class="font-bold text-slate-800 text-sm">Pesanan Masuk</h3>
                            <button onclick="createNewOrder()" class="text-[10px] bg-slate-900 text-white px-2.5 py-1.5 rounded-lg font-bold hover:bg-slate-800 shadow-sm transition-colors">+ Sesi Baru</button>
                        </div>
                        <div id="nav-queue-list" class="max-h-72 overflow-y-auto p-3 space-y-2 bg-white">
                            <!-- Injected by JS -->
                        </div>
                    </div>
                </div>

                <!-- User Profile -->
                <div class="flex items-center gap-3 border-l border-slate-700 pl-5">
                    <div class="text-right hidden sm:block">
                        <p class="text-sm font-bold text-slate-100">Budi Utama</p>
                        <p class="text-[11px] text-slate-400 font-medium">Kasir • Shift Pagi</p>
                    </div>
                    <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center shadow-inner text-white font-bold text-sm">
                        BU
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Layout -->
    <main class="flex-1 flex overflow-hidden relative">
        
        <!-- ==================================
             KOLOM UTAMA: PRODUCT GRID
        =================================== -->
        <section class="flex-1 flex flex-col bg-slate-50 relative z-0 pb-20 lg:pb-0">
            <!-- Search Bar Modern -->
            <div class="p-4 bg-white border-b border-slate-200 shrink-0 z-10 flex items-center justify-between gap-4">
                <div class="relative flex-1 max-w-2xl">
                    <i class="fas fa-search absolute left-4 top-3.5 text-slate-400"></i>
                    <input type="text" id="product-search" placeholder="Ketik nama produk..." class="w-full pl-11 pr-4 py-3 bg-slate-100/70 hover:bg-slate-100 focus:bg-white border border-transparent focus:border-blue-400 rounded-xl text-sm transition-all outline-none text-slate-800 font-medium shadow-sm">
                </div>
                <div class="hidden md:block text-xs font-semibold text-slate-400 uppercase tracking-widest">
                    Katalog Produk
                </div>
            </div>

            <!-- Product Grid -->
            <div class="flex-1 overflow-y-auto p-4 sm:p-5">
                <div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-4 sm:gap-5" id="product-grid">
                    <!-- Products injected by JS -->
                </div>
            </div>
        </section>

        <!-- ==================================
             KOLOM KANAN: ACTIVE CART (DRAWER DI HP)
        =================================== -->
        <div id="cart-overlay" onclick="toggleMobileCart()" class="lg:hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-30 hidden opacity-0 transition-opacity"></div>
        
        <aside id="cart-sidebar" class="fixed inset-y-0 right-0 z-40 w-[85%] sm:w-96 bg-white border-l border-slate-200 flex flex-col shadow-2xl transform translate-x-full lg:translate-x-0 lg:relative transition-transform duration-300 ease-in-out">
            
            <!-- Cart Header -->
            <div class="p-5 border-b border-slate-100 bg-white flex justify-between items-center shrink-0">
                <div>
                    <h2 class="font-extrabold text-slate-900 text-lg" id="cart-order-id">Transaksi Baru</h2>
                    <p class="text-xs text-slate-500 font-medium mt-0.5 flex items-center gap-1" id="cart-order-staff">
                        <i class="fas fa-user-tag text-[10px]"></i> Mandiri
                    </p>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="clearCart()" class="w-9 h-9 rounded-xl text-slate-400 hover:text-red-500 hover:bg-red-50 flex items-center justify-center transition-colors" title="Kosongkan">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                    <button onclick="toggleMobileCart()" class="lg:hidden w-9 h-9 rounded-xl bg-slate-100 text-slate-600 flex items-center justify-center">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>

            <!-- Cart Items -->
            <div class="flex-1 overflow-y-auto p-4 bg-slate-50/50" id="cart-items-container">
                <!-- Empty State -->
                <div id="cart-empty-state" class="h-full flex flex-col items-center justify-center text-slate-400">
                    <div class="w-20 h-20 bg-slate-100 rounded-full flex items-center justify-center mb-4">
                        <i class="fas fa-receipt text-3xl text-slate-300"></i>
                    </div>
                    <p class="text-sm font-semibold text-slate-500">Belum ada pesanan</p>
                    <p class="text-xs text-slate-400 mt-1">Pilih produk dari katalog</p>
                </div>
                
                <!-- Items list -->
                <div id="cart-items-list" class="space-y-3 hidden">
                    <!-- Injected by JS -->
                </div>
            </div>

            <!-- Cart Footer -->
            <div class="bg-white border-t border-slate-100 p-5 shrink-0 shadow-[0_-10px_20px_-10px_rgba(0,0,0,0.05)]">
                <div class="flex justify-between items-end mb-5">
                    <span class="text-slate-500 text-sm font-bold uppercase tracking-wider">Total Pembayaran</span>
                    <span id="cart-grand-total" class="text-2xl font-black text-slate-900">Rp 0</span>
                </div>
                
                <button id="btn-bayar" onclick="openPaymentModal()" disabled class="w-full bg-slate-900 hover:bg-slate-800 disabled:bg-slate-200 disabled:text-slate-400 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-slate-900/20 transition-all flex items-center justify-center gap-2 text-base">
                    Proses Tagihan <i class="fas fa-arrow-right text-sm"></i>
                </button>
            </div>
        </aside>

        <!-- FLOATING BOTTOM BUTTON (HANYA DI HP) -->
        <div class="lg:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 p-4 z-20 shadow-[0_-15px_30px_-5px_rgba(0,0,0,0.1)] rounded-t-2xl">
            <button onclick="toggleMobileCart()" class="w-full bg-slate-900 text-white font-bold py-3.5 rounded-xl flex justify-between items-center px-6 active:scale-[0.98] transition-transform shadow-lg shadow-slate-900/20">
                <span class="flex items-center gap-3">
                    <div class="bg-white/20 w-8 h-8 flex items-center justify-center rounded-lg">
                        <span id="mobile-cart-qty" class="text-sm">0</span>
                    </div>
                    <span class="text-sm">Item Terpilih</span>
                </span>
                <span id="mobile-cart-total" class="text-lg tracking-wide">Rp 0</span>
            </button>
        </div>
    </main>

    <!-- ==================================
         PAYMENT MODAL (Modernized)
    =================================== -->
    <div id="payment-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[60] hidden items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-lg flex flex-col max-h-[90vh] fade-in overflow-hidden">
            
            <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                <h2 class="text-lg font-bold text-slate-800">Selesaikan Pembayaran</h2>
                <button onclick="closePaymentModal()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-red-50 hover:text-red-500 flex items-center justify-center transition-colors text-slate-500">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <div class="p-6 flex-1 overflow-y-auto space-y-6 bg-white">
                <div class="bg-slate-50 rounded-2xl p-5 flex flex-col items-center justify-center border border-slate-100">
                    <span class="text-slate-500 text-xs font-bold uppercase tracking-widest mb-1">Total Tagihan</span>
                    <span id="modal-grand-total" class="text-3xl font-black text-slate-900 tracking-tight">Rp 0</span>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-4">
                        <label class="text-sm font-bold text-slate-800">Detail Pembayaran</label>
                        <button onclick="addPaymentRow()" class="text-[10px] bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg font-bold transition-colors uppercase tracking-wider">
                            + Split Bill
                        </button>
                    </div>
                    <div id="payment-rows" class="space-y-3"></div>
                </div>

                <div class="space-y-3 pt-4 border-t border-slate-100">
                    <div class="flex justify-between text-slate-500 text-sm font-medium px-1">
                        <span>Total Diterima</span>
                        <span id="modal-total-paid" class="font-bold text-slate-700">Rp 0</span>
                    </div>
                    <div id="modal-calculation-result" class="flex justify-between p-4 rounded-2xl bg-slate-50 items-center border border-slate-100">
                        <span class="font-bold text-slate-600 text-sm" id="modal-calc-label">Status:</span>
                        <span class="text-xl font-black text-slate-800" id="modal-calc-value">Rp 0</span>
                    </div>
                </div>
            </div>

            <div class="p-5 border-t border-slate-100 flex gap-3 bg-slate-50/50">
                <button onclick="closePaymentModal()" class="w-1/3 py-3 rounded-xl border border-slate-200 text-slate-600 font-bold hover:bg-slate-100 transition-colors">
                    Batal
                </button>
                <button id="btn-complete-payment" onclick="processPayment()" disabled class="w-2/3 py-3 rounded-xl bg-blue-600 hover:bg-blue-700 disabled:bg-slate-200 disabled:text-slate-400 text-white font-bold transition-all shadow-lg shadow-blue-600/20">
                    Cetak Struk
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-6 left-1/2 transform -translate-x-1/2 z-[70] bg-slate-900 text-white px-6 py-3.5 rounded-full shadow-2xl flex items-center gap-3 transition-all duration-300 opacity-0 translate-y-[-20px] pointer-events-none w-max max-w-[90vw]">
        <i class="fas fa-check-circle text-blue-400 text-lg"></i>
        <span id="toast-msg" class="font-semibold text-sm">Berhasil!</span>
    </div>

    <script>
        // --- MASTER DATA (Tanpa Ikon & Warna) ---
        const masterProducts = [
            { id: 1, name: 'Ember Besar Plastik', price: 75000 },
            { id: 2, name: 'Sapu Lidi Taman', price: 14500 },
            { id: 3, name: 'Serok Sampah', price: 36000 },
            { id: 4, name: 'Wajan Anti Lengket 30cm', price: 165000 },
            { id: 5, name: 'Bak Mandi Bayi', price: 28000 },
            { id: 6, name: 'Rak Kecil 3 Susun', price: 130000 },
            { id: 7, name: 'Sandal Jepit Karet', price: 15000 },
            { id: 8, name: 'Keset Kain Perca', price: 25000 },
            { id: 9, name: 'Susu Kaleng Kental Manis', price: 12000 },
            { id: 10, name: 'Kopi Hitam Bubuk 200gr', price: 15000 }
        ];

        let queue = [
            {
                orderId: 'INV-' + Math.floor(Math.random() * 10000),
                staff: 'Andi Pramuniaga',
                time: '10:30',
                items: [ { ...masterProducts[0], qty: 2 }, { ...masterProducts[2], qty: 1 } ]
            },
            {
                orderId: 'INV-' + Math.floor(Math.random() * 10000),
                staff: 'Siti (Staff Gudang)',
                time: '10:35',
                items: [ { ...masterProducts[3], qty: 1 }, { ...masterProducts[6], qty: 2 } ]
            }
        ];

        let activeOrder = null;
        let paymentRows = [];
        let grandTotalActive = 0;
        let totalItemsActive = 0;

        // --- UTILITIES ---
        const formatRupiah = (number) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number);

        const showToast = (msg) => {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('opacity-0', 'translate-y-[-20px]');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-[-20px]');
            }, 3000);
        };

        const toggleNotifications = (e) => {
            if(e) e.stopPropagation();
            document.getElementById('notification-dropdown').classList.toggle('hidden');
        };

        document.addEventListener('click', (e) => {
            const dropdown = document.getElementById('notification-dropdown');
            if (!dropdown.classList.contains('hidden') && !e.target.closest('.relative')) {
                dropdown.classList.add('hidden');
            }
        });

        const toggleMobileCart = () => {
            const sidebar = document.getElementById('cart-sidebar');
            const overlay = document.getElementById('cart-overlay');
            if (sidebar.classList.contains('translate-x-full')) {
                sidebar.classList.remove('translate-x-full');
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.remove('opacity-0'), 10);
            } else {
                sidebar.classList.add('translate-x-full');
                overlay.classList.add('opacity-0');
                setTimeout(() => overlay.classList.add('hidden'), 300);
            }
        };

        // --- RENDER PRODUK (HANYA TEKS, DESAIN MODERN) ---
        const renderProducts = (filter = '') => {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            
            const filtered = masterProducts.filter(p => p.name.toLowerCase().includes(filter.toLowerCase()));
            
            if(filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-16 text-center text-slate-400 font-medium">Katalog tidak ditemukan</div>`;
                return;
            }

            filtered.forEach(product => {
                const card = document.createElement('div');
                // Desain Card Modern Tanpa Gambar
                card.className = 'bg-white rounded-2xl p-4 sm:p-5 shadow-sm border border-slate-200 hover:border-slate-800 hover:shadow-lg active:scale-95 cursor-pointer transition-all duration-300 flex flex-col justify-between group relative overflow-hidden h-36 sm:h-40';
                card.onclick = () => addProductToCart(product);
                card.innerHTML = `
                    <div class="absolute top-0 left-0 w-full h-1 bg-slate-800 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                    <div>
                        <h3 class="font-bold text-slate-600 text-xs sm:text-sm leading-tight mb-2 group-hover:text-slate-900 transition-colors">${product.name}</h3>
                        <p class="text-slate-900 font-black text-base sm:text-xl tracking-tight">${formatRupiah(product.price)}</p>
                    </div>
                    <div class="mt-3 w-full py-2 bg-slate-50 group-hover:bg-slate-900 text-slate-600 group-hover:text-white rounded-xl text-xs font-bold text-center transition-all duration-300">
                        Tambah +
                    </div>
                `;
                grid.appendChild(card);
            });
        };

        document.getElementById('product-search').addEventListener('input', (e) => renderProducts(e.target.value));

        // --- RENDER ANTREAN DI NAVBAR ---
        const renderQueue = () => {
            const list = document.getElementById('nav-queue-list');
            const count = document.getElementById('nav-queue-count');
            list.innerHTML = '';
            count.innerText = queue.length;
            count.classList.toggle('hidden', queue.length === 0);

            if(queue.length === 0) {
                list.innerHTML = `<div class="text-center text-slate-400 py-6 text-xs font-medium">Belum ada pesanan</div>`;
                return;
            }

            queue.forEach(order => {
                const totalItems = order.items.reduce((sum, item) => sum + item.qty, 0);
                const isActive = activeOrder && activeOrder.orderId === order.orderId;
                
                const card = document.createElement('div');
                card.className = `p-3 rounded-xl border cursor-pointer transition-all ${isActive ? 'bg-slate-900 border-slate-900 text-white' : 'bg-white hover:bg-slate-50 border-slate-200'}`;
                card.onclick = () => {
                    loadOrderFromQueue(order.orderId);
                    document.getElementById('notification-dropdown').classList.add('hidden');
                };
                
                card.innerHTML = `
                    <div class="flex justify-between items-center mb-2">
                        <span class="font-extrabold text-xs tracking-wide ${isActive ? 'text-white' : 'text-slate-800'}">${order.orderId}</span>
                        <span class="text-[10px] font-semibold ${isActive ? 'text-slate-300' : 'text-slate-400'}">${order.time}</span>
                    </div>
                    <div class="flex justify-between items-center text-[11px]">
                        <span class="${isActive ? 'text-slate-300' : 'text-slate-500'} font-medium">${order.staff}</span>
                        <span class="font-bold ${isActive ? 'bg-white/20' : 'bg-slate-100 text-slate-700'} px-2 py-0.5 rounded-md">${totalItems} Pcs</span>
                    </div>
                `;
                list.appendChild(card);
            });
        };

        // --- RENDER KERANJANG (CART) ---
        const renderCart = () => {
            const container = document.getElementById('cart-items-list');
            const emptyState = document.getElementById('cart-empty-state');
            const btnBayar = document.getElementById('btn-bayar');
            
            container.innerHTML = '';
            grandTotalActive = 0;
            totalItemsActive = 0;

            if(!activeOrder || activeOrder.items.length === 0) {
                container.classList.add('hidden');
                emptyState.classList.remove('hidden');
                document.getElementById('cart-grand-total').innerText = 'Rp 0';
                btnBayar.disabled = true;
                
                document.getElementById('cart-order-id').innerText = activeOrder ? `${activeOrder.orderId}` : 'Transaksi Baru';
                document.getElementById('cart-order-staff').innerText = activeOrder ? `Mandiri` : '-';
                updateMobileFloatingBtn();
                return;
            }

            container.classList.remove('hidden');
            emptyState.classList.add('hidden');
            btnBayar.disabled = false;

            document.getElementById('cart-order-id').innerText = `${activeOrder.orderId}`;
            document.getElementById('cart-order-staff').innerText = activeOrder.staff !== 'Kasir' ? `Dari: ${activeOrder.staff}` : 'Sesi Mandiri';

            activeOrder.items.forEach((item, index) => {
                const subtotal = item.price * item.qty;
                grandTotalActive += subtotal;
                totalItemsActive += item.qty;

                const row = document.createElement('div');
                row.className = 'bg-white border border-slate-100 p-3 rounded-2xl shadow-sm flex justify-between items-center';
                row.innerHTML = `
                    <div class="flex-1 min-w-0 pr-3">
                        <h4 class="text-xs sm:text-sm font-bold text-slate-800 leading-tight mb-1">${item.name}</h4>
                        <p class="text-[11px] font-semibold text-slate-400">${formatRupiah(item.price)}</p>
                    </div>
                    <div class="flex flex-col items-end gap-2 shrink-0">
                        <span class="text-sm font-black text-slate-900">${formatRupiah(subtotal)}</span>
                        <div class="flex items-center bg-slate-50 border border-slate-200 rounded-lg overflow-hidden h-7">
                            <button onclick="updateCartQty(${index}, -1)" class="w-7 h-full flex items-center justify-center hover:bg-slate-200 text-slate-600 transition-colors"><i class="fas fa-minus text-[10px]"></i></button>
                            <span class="w-7 text-center text-xs font-bold text-slate-800">${item.qty}</span>
                            <button onclick="updateCartQty(${index}, 1)" class="w-7 h-full flex items-center justify-center hover:bg-slate-800 hover:text-white text-slate-800 transition-colors"><i class="fas fa-plus text-[10px]"></i></button>
                        </div>
                    </div>
                `;
                container.appendChild(row);
            });

            document.getElementById('cart-grand-total').innerText = formatRupiah(grandTotalActive);
            updateMobileFloatingBtn();
        };

        const updateMobileFloatingBtn = () => {
            document.getElementById('mobile-cart-qty').innerText = `${totalItemsActive}`;
            document.getElementById('mobile-cart-total').innerText = formatRupiah(grandTotalActive);
        };

        // --- CART ACTIONS ---
        const createNewOrder = () => {
            const timestamp = new Date().getTime().toString().slice(-4);
            activeOrder = { orderId: `INV-${timestamp}`, staff: 'Kasir', items: [] };
            document.getElementById('notification-dropdown').classList.add('hidden');
            renderQueue(); renderCart();
        };

        const loadOrderFromQueue = (orderId) => {
            const orderToLoad = queue.find(q => q.orderId === orderId);
            activeOrder = JSON.parse(JSON.stringify(orderToLoad)); 
            renderQueue(); renderCart();
            
            if(window.innerWidth < 1024) {
                const sidebar = document.getElementById('cart-sidebar');
                if (sidebar.classList.contains('translate-x-full')) toggleMobileCart();
            }
        };

        const addProductToCart = (product) => {
            if(!activeOrder) createNewOrder();
            const existingIndex = activeOrder.items.findIndex(item => item.id === product.id);
            if(existingIndex > -1) activeOrder.items[existingIndex].qty += 1;
            else activeOrder.items.push({ ...product, qty: 1 });
            renderCart();
            showToast(`${product.name} ditambahkan`);
        };

        const updateCartQty = (index, delta) => {
            if(!activeOrder) return;
            activeOrder.items[index].qty += delta;
            if(activeOrder.items[index].qty <= 0) activeOrder.items.splice(index, 1);
            renderCart();
        };

        const clearCart = () => {
            if(!activeOrder) return;
            activeOrder.items = [];
            renderCart();
        };

        // --- PAYMENT LOGIC ---
        const openPaymentModal = () => {
            if(!activeOrder || activeOrder.items.length === 0) return;
            document.getElementById('payment-modal').classList.remove('hidden');
            document.getElementById('payment-modal').classList.add('flex');
            document.getElementById('modal-grand-total').innerText = formatRupiah(grandTotalActive);
            
            paymentRows = [{ id: Date.now(), method: 'Tunai', amount: grandTotalActive }];
            renderPaymentRows();
        };

        const closePaymentModal = () => {
            document.getElementById('payment-modal').classList.add('hidden');
            document.getElementById('payment-modal').classList.remove('flex');
        };

        const addPaymentRow = () => { paymentRows.push({ id: Date.now(), method: 'QRIS', amount: 0 }); renderPaymentRows(); };
        const removePaymentRow = (id) => { if(paymentRows.length > 1) { paymentRows = paymentRows.filter(r => r.id !== id); renderPaymentRows(); }};
        const updatePaymentMethod = (id, value) => { const row = paymentRows.find(r => r.id === id); if(row) row.method = value; };
        
        const updatePaymentAmount = (id, value) => {
            const row = paymentRows.find(r => r.id === id);
            if(row) { row.amount = parseInt(value) || 0; calculatePaymentResult(); }
        };

        const renderPaymentRows = () => {
            const container = document.getElementById('payment-rows');
            container.innerHTML = '';
            paymentRows.forEach((row) => {
                const div = document.createElement('div');
                div.className = 'flex gap-3 items-start';
                div.innerHTML = `
                    <div class="w-[35%]">
                        <select onchange="updatePaymentMethod(${row.id}, this.value)" class="w-full bg-slate-50 border border-slate-200 text-slate-700 text-xs sm:text-sm rounded-xl focus:ring-blue-500 focus:bg-white p-3 outline-none font-bold">
                            <option value="Tunai" ${row.method === 'Tunai' ? 'selected' : ''}>Tunai</option>
                            <option value="QRIS" ${row.method === 'QRIS' ? 'selected' : ''}>QRIS</option>
                            <option value="Debit" ${row.method === 'Debit' ? 'selected' : ''}>Debit</option>
                        </select>
                    </div>
                    <div class="flex-1 relative">
                        <span class="absolute left-4 top-3 font-bold text-slate-400 text-sm">Rp</span>
                        <input type="number" value="${row.amount}" oninput="updatePaymentAmount(${row.id}, this.value)" class="w-full bg-slate-50 focus:bg-white border border-slate-200 text-slate-900 text-base sm:text-lg font-black rounded-xl focus:ring-blue-500 p-2.5 pl-10 outline-none transition-colors">
                    </div>
                    ${paymentRows.length > 1 ? `
                    <button onclick="removePaymentRow(${row.id})" class="mt-1 w-10 h-10 shrink-0 rounded-xl bg-red-50 text-red-500 hover:bg-red-100 hover:text-red-600 flex items-center justify-center transition-colors"><i class="fas fa-trash text-sm"></i></button>
                    ` : '<div class="w-10"></div>'}
                `;
                container.appendChild(div);
            });
            calculatePaymentResult();
        };

        const calculatePaymentResult = () => {
            const totalPaid = paymentRows.reduce((sum, row) => sum + row.amount, 0);
            document.getElementById('modal-total-paid').innerText = formatRupiah(totalPaid);

            const resultContainer = document.getElementById('modal-calculation-result');
            const labelEl = document.getElementById('modal-calc-label');
            const valueEl = document.getElementById('modal-calc-value');
            const btnComplete = document.getElementById('btn-complete-payment');
            const diff = totalPaid - grandTotalActive;

            if (diff < 0) {
                resultContainer.className = 'flex justify-between p-4 rounded-2xl bg-red-50 items-center border border-red-100';
                labelEl.innerText = 'Sisa (Kurang)';
                labelEl.className = 'font-bold text-red-700 text-sm';
                valueEl.innerText = formatRupiah(Math.abs(diff));
                valueEl.className = 'text-lg sm:text-xl font-black text-red-700';
                btnComplete.disabled = true;
            } else {
                resultContainer.className = 'flex justify-between p-4 rounded-2xl bg-green-50 items-center border border-green-100';
                labelEl.innerText = diff === 0 ? 'Pas' : 'Uang Kembali';
                labelEl.className = 'font-bold text-green-700 text-sm';
                valueEl.innerText = formatRupiah(diff);
                valueEl.className = 'text-xl font-black text-green-700';
                btnComplete.disabled = false;
            }
        };

        const processPayment = () => {
            queue = queue.filter(q => q.orderId !== activeOrder.orderId);
            activeOrder = null;
            closePaymentModal();
            if(window.innerWidth < 1024) toggleMobileCart(); 
            renderQueue(); renderCart();
            showToast('Transaksi Berhasil! Mencetak struk...');
        };

        // --- INIT ---
        window.onload = () => {
            renderProducts();
            renderQueue();
            renderCart();
            // Inisialisasi 1 sesi order kosong di awal
            createNewOrder();
        };
    </script>
</body>
</html>
